name: Main workflow


on:
  pull_request:
  push:
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        ocaml-compiler:
          - "4.11.2"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v3

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Build Ocaml
        run: opam pin alt-ergo . -y

      - name: Install ocaml
        run: opam install alt-ergo --dest-dir=staging

      - name: Upload package
        uses: actions/upload-artifact@v3
        with:
          name: why3pack-${{matrix.os}}
          path: staging
