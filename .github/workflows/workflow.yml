name: Main workflow


on:
  pull_request:
  push:
  schedule:
    # Prime the caches every Monday
    - cron: 0 1 * * MON

permissions: read-all

jobs:
  build:
    strategy:
      fail-fast: false
      matrix:
        os:
          - macos-latest
          - ubuntu-latest
          - windows-latest
        ocaml-compiler:
          - "4.11.2"

    runs-on: ${{ matrix.os }}

    steps:
      - name: Checkout tree
        uses: actions/checkout@v3

      - name: Set-up OCaml ${{ matrix.ocaml-compiler }}
        uses: ocaml/setup-ocaml@v2
        with:
          ocaml-compiler: ${{ matrix.ocaml-compiler }}

      - name: Delete GMP dll
        run: python -c "import glob, os; [os.remove(f) for f in glob.glob('/usr/x86_64-w64-mingw32/sys-root/mingw/*/libgmp*dll*')]"

      - name: Install alt-ergo
        run: opam install alt-ergo --destdir=staging

      - name: Upload package
        uses: actions/upload-artifact@v3
        with:
          name: altergo-${{matrix.os}}
          path: staging
